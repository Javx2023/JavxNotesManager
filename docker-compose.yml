services:
  notes-manager:
    build: .
    container_name: javxnotesmanager
    ports:
      - "${FLASK_PORT:-5000}:5000"
    volumes:
      - ${HOST_NOTAS_DIR}:/data/notas
    env_file:
      - .env
    environment:
      - NOTAS_DIR=/data/notas
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:5000/api/health')"]
      interval: 30s
      timeout: 10s
      retries: 3
